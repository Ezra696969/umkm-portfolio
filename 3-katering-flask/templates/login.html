{% extends "base.html" %}
{% block title %}Login admin{% endblock %}
{% block body %}
<main class="center">
  <h1>Login admin</h1>
  {% for c,m in get_flashed_messages(with_categories=true) %}<p class="flash {{ c }}">{{ m }}</p>{% endfor %}
  <form method="post" class="narrow">
    <input type="hidden" name="_csrf" value="{{ csrf() }}">
    <label>Kata sandi<input type="password" name="password" required autofocus></label>
    <button class="btn" type="submit">Masuk</button>
  </form>
</main>
{% endblock %}
